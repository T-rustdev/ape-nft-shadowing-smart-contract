[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

# Remappings for imports
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@layerzerolabs/=node_modules/@layerzerolabs/",
]

# RPC endpoints
[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
apechain = "${APECHAIN_RPC_URL}"
curtis = "https://curtis.rpc.caldera.xyz/http"
sepolia = "${SEPOLIA_RPC_URL}"

# Etherscan verification
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
apechain = { key = "no-api-key", url = "https://apescan.io/api" }
curtis = { key = "no-api-key", url = "https://curtis.explorer.caldera.xyz/api" }

# Gas reporting
gas_reports = ["*"]

# Fuzz testing
[fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

